    <title>WorkSafety - Smart Safety</title>
    
    <style>
      /* Critical CSS for splash screen to prevent white flash */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0F1729;
        height: 100%;
        width: 100%;
      }
      
      #root {
        min-height: 100vh;
        background-color: #0F1729;
      }
      
      /* iOS safe area support */
      .safe-area-top {
        padding-top: env(safe-area-inset-top);
      }
      .safe-area-bottom {
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Handle module loading errors (cache issues)
      window.addEventListener('error', function(e) {
        if (e.target && e.target.tagName === 'SCRIPT') {
          console.error('Script loading error:', e.target.src);
          // If it's a module script error, likely cache issue
          if (e.target.type === 'module' || e.target.src.includes('.js')) {
            // Check if we've already tried reloading
            if (!sessionStorage.getItem('cache_cleared')) {
              sessionStorage.setItem('cache_cleared', 'true');
              console.log('Attempting to clear cache and reload...');
              // Clear caches and reload
              if ('caches' in window) {
                caches.keys().then(function(cacheNames) {
                  return Promise.all(
                    cacheNames.map(function(cacheName) {
                      return caches.delete(cacheName);
                    })
                  );
                }).then(function() {
                  window.location.reload(true);
                });
              } else {
                window.location.reload(true);
              }
            }
          }
        }
      }, true);
    </script>
  </body>

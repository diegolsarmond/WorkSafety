<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkSafety — Harness</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <div class="title">WorkSafety</div>
          <div class="subtitle">Harness de validação (backend) — não é o UX final</div>
        </div>
      </header>

      <section class="card">
        <div class="hint">
          UI final: <code>documentacao/WorkSafety - mobile.pdf</code> e <code>documentacao/WorkSafety - tablet.pdf</code>.
          Este harness fica em <code>/app/harness/</code>.
        </div>
      </section>

      <section class="card">
        <h2>Login</h2>
        <form id="loginForm" class="grid">
          <label>
            Email
            <input name="email" type="email" placeholder="demo@example.com" required />
          </label>
          <label>
            Senha
            <input name="password" type="password" placeholder="demo12345" required />
          </label>
          <div class="row">
            <button type="submit">Entrar</button>
            <button type="button" id="logoutBtn" class="secondary">Sair</button>
          </div>
        </form>
      </section>

      <section class="card">
        <div class="row between">
          <h2>Assessments</h2>
          <button type="button" id="refreshAssessmentsBtn" class="secondary">Atualizar</button>
        </div>
        <form id="createAssessmentForm" class="grid">
          <label>
            Title
            <input name="title" type="text" placeholder="A1" />
          </label>
          <label>
            Description
            <input name="description" type="text" placeholder="Descrição" />
          </label>
          <label>
            Status
            <select name="status">
              <option value="draft">draft</option>
              <option value="captured" selected>captured</option>
              <option value="submitted">submitted</option>
            </select>
          </label>
          <label>
            client_ref (UUID)
            <div class="row">
              <input name="client_ref" type="text" placeholder="auto" />
              <button type="button" id="genAssessmentRefBtn" class="secondary small">Gerar</button>
            </div>
          </label>
          <div class="row">
            <button type="submit">Criar/Idempotente</button>
          </div>
        </form>

        <div class="split">
          <div>
            <h3>Lista</h3>
            <div id="assessmentsList" class="list"></div>
          </div>
          <div>
            <h3>Selecionado</h3>
            <div class="kv">
              <div><span class="k">assessment_id</span><span id="selectedAssessmentId" class="v">—</span></div>
              <div><span class="k">client_ref</span><span id="selectedAssessmentRef" class="v">—</span></div>
              <div><span class="k">status</span><span id="selectedAssessmentStatus" class="v">—</span></div>
            </div>
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Upload Evidence</h2>
        <form id="uploadEvidenceForm" class="grid" enctype="multipart/form-data">
          <label>
            File (.jpg)
            <input name="file" type="file" accept="image/*" required />
          </label>
          <label>
            client_ref (UUID)
            <div class="row">
              <input name="client_ref" type="text" placeholder="auto" required />
              <button type="button" id="genEvidenceRefBtn" class="secondary small">Gerar</button>
            </div>
          </label>
          <label>
            captured_at (ISO)
            <input name="captured_at" type="text" placeholder="2026-02-14T12:00:00Z" required />
          </label>
          <label>
            latitude
            <input name="latitude" type="number" step="0.000001" placeholder="-15.793889" required />
          </label>
          <label>
            longitude
            <input name="longitude" type="number" step="0.000001" placeholder="-47.882778" required />
          </label>
          <div class="row">
            <button type="submit">Enviar</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Console</h2>
        <pre id="console" class="console"></pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>

# =====================================================================
# Nginx gateway REFERENCE CONFIG for inovacao.dataprev.gov.br
# =====================================================================
# This file is NOT deployed directly — it documents the expected gateway
# configuration managed by the Dataprev infrastructure team.
#
# The gateway only routes TWO path prefixes to this application:
#
#   /worksafety/*  →  http://200.152.38.136:3000  (frontend Nginx)
#   /admin/*       →  http://200.152.38.136:3001  (WorkSafetyWeb Nginx)
#
# There is NO /api/ or /media/ route on the gateway.
# All API/media access is handled internally:
#   - Frontend calls /worksafety/api/* → port 3000 nginx rewrites to /api/* → backend
#   - Admin calls /admin/api/*  → port 3001 nginx rewrites to /api/* → backend
#   - Evidence/report download URLs use /worksafety/api/... paths (path-only, no host)
#
# The backend (port 8000) is NOT directly exposed through the gateway.
# Swagger docs are only accessible via direct IP: http://200.152.38.136:8000/api/docs
# =====================================================================

server {
    listen 443 ssl http2;
    server_name inovacao.dataprev.gov.br;

    # TLS certs (adjust to your environment)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    # Shared proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Main app (frontend) — all /worksafety/* traffic including
    # /worksafety/api/* is forwarded to port 3000, where the
    # frontend Nginx handles API proxying to the backend.
    location /worksafety/ {
        proxy_pass http://200.152.38.136:3000;
    }

    # WorkSafetyWeb admin app — all /admin/* traffic including
    # /admin/api/* is forwarded to port 3001, where the
    # WorkSafetyWeb Nginx handles API proxying to the backend.
    location /admin/ {
        proxy_pass http://200.152.38.136:3001;
    }

    # Optional health endpoint for gateway
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy";
    }
}

# Optional HTTP -> HTTPS redirect
server {
    listen 80;
    server_name inovacao.dataprev.gov.br;
    return 301 https://$host$request_uri;
}

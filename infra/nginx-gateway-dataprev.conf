# Nginx gateway example for inovacao.dataprev.gov.br
# Path routing:
# - /worksafety/     -> 200.152.38.136:3000
# - /admin/          -> 200.152.38.136:3001
# - /api/            -> 200.152.38.136:8000
# - /worksafety/api/ -> 200.152.38.136:8000 (rewritten to /api/)

server {
    listen 443 ssl http2;
    server_name inovacao.dataprev.gov.br;

    # TLS certs (adjust to your environment)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    # Shared proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # App principal API (must be before /worksafety/)
    location /worksafety/api/ {
        rewrite ^/worksafety/api/(.*)$ /api/$1 break;
        proxy_pass http://200.152.38.136:8000;
    }

    # App principal static/media compatibility
    location /worksafety/media/ {
        rewrite ^/worksafety/media/(.*)$ /media/$1 break;
        proxy_pass http://200.152.38.136:8000;
    }

    # Backend direct API for admin app
    location /api/ {
        proxy_pass http://200.152.38.136:8000;
    }

    # Optional direct media/static endpoints
    location /media/ {
        proxy_pass http://200.152.38.136:8000;
    }

    location /static/ {
        proxy_pass http://200.152.38.136:8000;
    }

    # Main app
    location /worksafety/ {
        proxy_pass http://200.152.38.136:3000;
    }

    # WorkSafetyWeb admin app
    location /admin/ {
        proxy_pass http://200.152.38.136:3001;
    }

    # Optional health endpoint for gateway
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy";
    }
}

# Optional HTTP -> HTTPS redirect
server {
    listen 80;
    server_name inovacao.dataprev.gov.br;
    return 301 https://$host$request_uri;
}

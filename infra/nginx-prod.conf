upstream backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # --------- ASSETS ---------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA icons / manifest
    location ~* \.(ico|png|svg|webmanifest|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PWA icons / manifest in /worksafety/ 
    location ~* ^/worksafety/.+\.(ico|png|svg|webmanifest|json)$ {
        rewrite ^/worksafety/(.*)$ /$1 break;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # --------- BACKEND PROXY ---------
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /static/ {
        proxy_pass http://backend/static/;
    }

    # --------- WORKSAFETY API PROXY ---------
    # Must come BEFORE /worksafety/ location to intercept API calls
    location /worksafety/api/ {
        rewrite ^/worksafety/api/(.*)$ /api/$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # --------- FRONTEND ROUTES ---------
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # WorkSafety app (Olimpia) - serve from /worksafety/
    location /worksafety/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # SPA fallback - App principal
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

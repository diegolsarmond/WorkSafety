upstream backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;
    # absolute_redirect off; (Not strictly needed with correct routing, but can leave if desired, let's leave it off just in case)
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    root /usr/share/nginx/html;

    # Cache para assets estáticos (hashed pelo Vite)
    location /worksafety/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /worksafety/admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cache para ícones e PWA
    location ~* \.(ico|png|svg|webmanifest|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # API Backend proxy
    location /worksafety/api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Django media files
    location /worksafety/media/ {
        proxy_pass http://backend/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django static files
    location /worksafety/static/ {
        proxy_pass http://backend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Admin Frontend - /worksafety/admin
    location /worksafety/admin/ {
        try_files $uri $uri/ /worksafety/admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # App Frontend - /worksafety
    location /worksafety/ {
        try_files $uri $uri/ /worksafety/index.html;
        add_header Cache-Control "no-cache";
    }

    # Root redirect
    location = / {
        return 301 /worksafety/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }
}

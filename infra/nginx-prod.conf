upstream backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    root /usr/share/nginx/html;

    # --------- ASSETS ---------
    # Unstripped
    location /worksafety/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /worksafety/admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Stripped
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /worksafety$uri =404;
    }
    location /admin/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /worksafety$uri =404;
    }

    # PWA icons / manifest
    location ~* \.(ico|png|svg|webmanifest|json)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri /worksafety$uri =404;
    }

    # --------- BACKEND PROXY ---------
    # Unstripped API/Media/Static
    location /worksafety/api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    location /worksafety/media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /worksafety/static/ {
        proxy_pass http://backend/static/;
    }

    # Stripped API/Media/Static
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location /static/ {
        proxy_pass http://backend/static/;
    }

    # --------- FRONTEND ROUTES ---------
    # Unstripped routes
    location /worksafety/admin/ {
        try_files $uri $uri/ /worksafety/admin/index.html;
        add_header Cache-Control "no-cache";
    }
    location /worksafety/ {
        try_files $uri $uri/ /worksafety/index.html;
        add_header Cache-Control "no-cache";
    }

    # Stripped routes
    location /admin/ {
        try_files /worksafety$uri /worksafety$uri/ /worksafety/admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }

    # Catch-all for stripped base path and others
    location / {
        try_files /worksafety$uri /worksafety$uri/ /worksafety/index.html;
        add_header Cache-Control "no-cache";
    }
}

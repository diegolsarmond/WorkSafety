upstream backend {
    server backend:8000;
}

server {
    listen 3000;
    server_name _;
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Cache para assets estáticos (hashed pelo Vite)
    location /worksafety/assets/ {
        alias /usr/share/nginx/html/worksafety/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /worksafety/admin/assets/ {
        alias /usr/share/nginx/html/admin/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache para ícones e PWA
    location ~* \.(ico|png|svg|webmanifest|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # API Backend proxy
    location /api/ {
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Django media files
    location /media/ {
        proxy_pass http://backend/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Django static files
    location /static/ {
        proxy_pass http://backend/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # App Frontend - /worksafety
    location /worksafety/ {
        alias /usr/share/nginx/html/worksafety/;
        try_files $uri $uri/ index.html;
        add_header Cache-Control "no-cache";
    }

    # Admin Frontend - /worksafety/admin
    location /worksafety/admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ index.html;
        add_header Cache-Control "no-cache";
    }

    # Root redirect
    location = / {
        return 301 /worksafety/;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy";
        add_header Content-Type text/plain;
    }
}

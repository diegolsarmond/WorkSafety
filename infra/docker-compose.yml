services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-worksafety}
      POSTGRES_USER: ${POSTGRES_USER:-worksafety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worksafety}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worksafety} -d ${POSTGRES_DB:-worksafety}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-worksafety}:${POSTGRES_PASSWORD:-worksafety}@db:5432/${POSTGRES_DB:-worksafety}
      DJANGO_SETTINGS_MODULE: config.settings.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app

volumes:
  postgres_data:
